# Action SHAs were not looked up offline. Major tags are pinned instead:
# actions/checkout@v4, actions/setup-python@v5.
# Firmware jobs run the espressif/idf:v5.3.2 image, matching the IDF
# checkout this tree is developed against (version.cmake 5.3.2, tag v5.3.2).
name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: system packages
        run: sudo apt-get update && sudo apt-get install -y libopus-dev build-essential

      - name: python dependencies
        run: |
          python -m pip install -r bridge/requirements.txt "ruff==0.16.10"
          python bridge/dsp.py build

      - name: ruff
        run: ruff check bridge

      - name: pytest
        run: python -m pytest -q

  face:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: face check
        run: python3 tests/face/check_face.py

  firmware-host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Checkout stays on the runner (the IDF image has no Node for the
      # JavaScript action). The test itself runs in the IDF image so cJSON
      # comes from that tree. The image ENV sets IDF_PATH.
      - name: host tests
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            espressif/idf:v5.3.2 \
            bash -lc "sh tests/firmware/run.sh"

  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: idf.py build
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work/firmware \
            espressif/idf:v5.3.2 \
            bash -lc "idf.py set-target esp32s3 && idf.py build"
