<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skwoop</title>
  <link rel="icon" href="data:,">
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #111;
      color: #eee;
      font-family: Montserrat, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      align-content: center;
      gap: 12px;
      padding: 16px;
      box-sizing: border-box;
    }

    h1 {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    canvas {
      width: min(92vw, 92vh);
      height: min(92vw, 92vh);
      background: #000;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    button {
      background: #222;
      color: #eee;
      border: 1px solid #444;
      border-radius: 999px;
      padding: 8px 14px;
      font: inherit;
      cursor: pointer;
    }

    button[aria-pressed="true"] {
      border-color: #7ee;
      color: #fff;
    }

    #need-server, #expr {
      margin: 0;
      max-width: 36rem;
      text-align: center;
    }

    #expr {
      color: #aaa;
    }
  </style>
</head>
<body>
  <h1>Skwoop</h1>
  <canvas id="face" width="466" height="466" role="img"
    aria-label="Skwoop robot face, current state: Ready"></canvas>
  <p id="need-server" hidden>Serve with python3 -m http.server</p>
  <div class="controls" role="group" aria-label="Face state">
    <button type="button" data-state="idle" aria-pressed="true">Idle</button>
    <button type="button" data-state="listening" aria-pressed="false">Listening</button>
    <button type="button" data-state="thinking" aria-pressed="false">Thinking</button>
    <button type="button" data-state="speaking" aria-pressed="false">Speaking</button>
  </div>
  <p id="expr" hidden></p>
  <script src="face-data.js"></script>
  <script src="face.js"></script>
  <script src="pad-face.js"></script>
  <script src="sample-face/dot-face.js"></script>
  <script src="demo.js"></script>
</body>
</html>
